
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - TrustVault</title>
</head>
<body>
    <h1>TrustVault 🔐</h1>
    <h2>Login</h2>

    {% if form.errors %}
        <p style="color: red;">
            Incorrect username or password. Please try again.
        </p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Login</button>
    </form>
</body>
</html>
